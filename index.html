<!DOCTYPE html>
<html lang="Pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Monster</title>
</head>
<body>

    <header>
        <div class="logo">
            <img src="./imgs/logo.png" alt="Logo Monster">
        </div>
        
        <div class="promo"><h2>PROMOÇÕES</h2></div>

        <div class="planeta">
            <img src="./imgs/mundo.png" alt="planeta">
            <h3>BR</h3>
        </div>
    </header>

    <main>
        <div class="textos">
            <div class="titulo"><h1>MEGA <br> MONSTER <br><span>ENERGY</span></h1></div>
            <div class="paragrafo"><p>O sabor de Monster é  <br> mesmo tempo marcante e <br> suave.</p></div>
        </div>

        <div class="fundo"><img src="./imgs/fundo.png" alt="fundo"></div>

        <div class="garrafa-meio">
            <img class="garrafa" src="./imgs/garrafa.png" alt="Lata de Monster">
        </div>

        <div class="direita-main">
            <div class="escrita"><h4>Monster Energy <br> Original</h4></div>

            <div class="marca"> <img src="./imgs/marca.png" alt="marca"></div>
        </div>
    </main>
    
    <footer>
        <div class="flecha-esq"><h1>&lt;</h1></div>

        <div class="direitos"><p>By. Luiz Maycleiton</p></div>

        <div class="flecha-dir"><h1>&gt;</h1></div>
    </footer>
</body>
</html>
